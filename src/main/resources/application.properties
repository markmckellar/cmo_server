# The port the app will run on, I think the default is 8080 if not specified
server.port=9090
# Listen on every network interface. Set e.g. server.address=127.0.0.1 to keep it local.
server.address=0.0.0.0

## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

## File Storage Properties
# All files uploaded through the REST API will be stored in this directory, if it does not exist it will be created
file.upload-dir=./local/uploads