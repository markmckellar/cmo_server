<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Home Cams</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #59636e; --line: #e3e5e8; --accent: #2b5d8a; --warn: #8a5a00; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15181c; --card: #1d2126; --text: #e6e8eb; --muted: #9aa4af; --line: #30363d; --accent: #7fb0dd; --warn: #e0b45c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 400px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p { margin: 8px 0; color: var(--muted); }
    #button { display: flex; justify-content: center; margin: 20px 0 8px; min-height: 44px; }
    #status { margin-top: 14px; }
    .warn { color: var(--warn); }
    a { color: var(--accent); }
    button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Home Cams</h1>
    <p id="intro">Sign in to see the cameras.</p>
    <div id="button"></div>
    <div id="status"></div>
    <p><small><a href="https://markmckellar.github.io/privacy.html">Privacy</a></small></p>
  </main>
  <script>
    // Where to go after signing in: ?next=/some/path on this site only (no other sites, no //host).
    const nextParam = new URLSearchParams(location.search).get('next') || '';
    const next = /^\/(?!\/)/.test(nextParam) ? nextParam : '/cmo_client/index.html';
    const statusEl = document.getElementById('status');
    const introEl = document.getElementById('intro');

    function show(html, cls) { statusEl.className = cls || ''; statusEl.innerHTML = html; }
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function signedInAs(cfg) {
      const who = esc(cfg.name || cfg.email) + ' (' + esc(cfg.email) + ')';
      if (cfg.status === 'admin' || cfg.status === 'member') { location.replace(next); return; }
      introEl.textContent = 'Signed in as ' + (cfg.name || cfg.email) + '.';
      if (cfg.status === 'rejected') show('<p class="warn">This account hasn\'t been given access.</p>' + signOutLink());
      else show('<p class="warn"><b>Waiting for approval.</b><br>' + who + ' has asked for access. You\'ll be able to see the cameras once it\'s approved; come back to this page then.</p>' + signOutLink());
      document.getElementById('button').style.display = 'none';
    }
    function signOutLink() { return '<p><button class="link" onclick="signOut()">Sign in with a different account</button></p>'; }
    async function signOut() { await fetch('/auth/logout', { method: 'POST' }); location.reload(); }

    async function onCredential(resp) {
      show('Signing in…');
      const r = await fetch('/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
      if (!r.ok) { show('<p class="warn">Sign-in didn\'t work. Please try again.</p>'); return; }
      const me = await r.json();
      signedInAs({ ...me });
    }

    async function start() {
      const cfg = await (await fetch('/auth/config')).json();
      if (cfg.mode === 'open') { introEl.textContent = 'This server needs no sign-in.'; location.replace(next); return; }
      if (cfg.caller === 'person') { signedInAs(cfg); return; }
      if (!cfg.google_client_id) { show('<p class="warn">Sign-in isn\'t set up on this server yet.</p>'); return; }
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => {
        google.accounts.id.initialize({ client_id: cfg.google_client_id, callback: onCredential, ux_mode: 'popup' });
        google.accounts.id.renderButton(document.getElementById('button'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' });
      };
      document.head.appendChild(s);
    }
    start().catch(() => show('<p class="warn">Couldn\'t reach the server.</p>'));
  </script>
</body>
</html>
