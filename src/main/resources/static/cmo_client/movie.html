<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Home Cams movie</title>
    <link rel="icon" href="favicon.ico">
    <!--
      The page the Telegram alerts' "watch-movie" link opens:
        movie.html?movie_path=/catcam/data/<camera>/<yyyyMMdd>/<event>/me_movie.mp4&time=<yyyy-MM-dd HH:mm:ss>
      Laid out like the web client's player (MeEventDetail.vue): the video fills the screen, scaled to fit,
      with a bar floating over the top for the camera, time and a button back to the event list.
    -->
    <style>
        :root {
            --accent: #f5a524;
            --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: var(--font);
            overflow: hidden;
        }

        .player {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
        }

        /* The video fills the screen and is scaled to fit, so it works in portrait and landscape */
        .player_video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Floats over the top of the video so it never takes height away from it */
        .player_bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px 28px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
            pointer-events: none;
        }

        /* Dark backdrops so the button and text stay readable over bright video */
        .player_home {
            flex: none;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            color: #fff;
            pointer-events: auto;
            transition: background 0.15s;
        }

        .player_home:hover {
            background: rgba(40, 40, 40, 0.8);
        }

        .player_home:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .player_info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            min-width: 0;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.6);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .player_info[hidden] {
            display: none;
        }

        .player_camera {
            font-weight: 600;
        }

        .player_time {
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
        }

        .player_error {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* Phone held sideways: slimmer bar */
        @media (orientation: landscape) and (max-height: 500px) {
            .player_bar {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: 20px;
            }

            .player_home {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="player" id="player">
        <video class="player_video" id="movie_element" playsinline controls autoplay></video>
        <div class="player_bar">
            <a class="player_home" href="index.html" aria-label="All events" title="All events">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
            </a>
            <div class="player_info">
                <span class="player_camera" id="camera_element"></span>
                <span class="player_time" id="time_element"></span>
            </div>
        </div>
        <div class="player_error" id="error_element" hidden></div>
    </div>

    <script>
        const params = new URL(window.location.href).searchParams;
        const moviePath = params.get('movie_path') || '';
        const time = params.get('time') || '';

        // camera from the path: /catcam/data/<camera>/<date>/<event>/me_movie.mp4, e.g. porch_cam -> "Porch cam"
        const camera = (moviePath.match(/^\/catcam\/data\/([^/]+)\//) || [])[1] || '';
        const cameraName = camera.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
        document.getElementById('camera_element').textContent = cameraName;
        document.getElementById('time_element').textContent = time;
        document.getElementById('camera_element').hidden = !cameraName;
        document.querySelector('.player_info').hidden = !cameraName && !time;
        if (cameraName || time) document.title = [cameraName, time].filter(Boolean).join(' · ');

        const video = document.getElementById('movie_element');
        const error = document.getElementById('error_element');
        function showError(text) {
            error.textContent = text;
            error.hidden = false;
        }

        if (moviePath.startsWith('/catcam/data/')) {
            // the movie is on the server this page came from (production, or a test server)
            video.src = window.location.origin + moviePath;
            video.addEventListener('error', () => showError('This movie could not be loaded.'));
            // browsers may block autoplay with sound until the page is tapped; the controls still work
            video.play().catch(() => {});
        } else {
            showError('No movie given.');
        }

        // Browsers only allow real fullscreen (which hides the phone's address bar) after a tap, so ask
        // on the first one. iPhone Safari doesn't support it for page elements: there the player just
        // fills the window. Taps on the back button go straight through.
        const player = document.getElementById('player');
        player.addEventListener('pointerup', (e) => {
            if (e.target.closest('.player_home')) return;
            if (!document.fullscreenElement && player.requestFullscreen) player.requestFullscreen().catch(() => {});
        }, { once: true });
    </script>
</body>
</html>
